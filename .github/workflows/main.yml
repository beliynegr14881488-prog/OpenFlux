name: Build Android Binaries

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile & tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK via sdkmanager
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Make build script executable
        run: chmod +x ./build_android.sh

      - name: Run Android Build Script
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CGO_ENABLED=1
          ./build_android.sh

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openflux-android-build
          path: |
            ./**/*.so
            ./**/*.aar
            ./**/*.apk
            ./**/bin/
            ./**/out/
            ./**/release/
          if-no-files-found: warn
          
